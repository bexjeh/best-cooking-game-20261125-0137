<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — Burger Barn Cooking Game</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main id="stage">
  <canvas id="game" width="1280" height="800" aria-label="Sizzle and Serve: a burger cooking game. Take orders from the board, stack ingredients on the plate in recipe order, and serve before the timer runs out."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="help">Click an ingredient or press 1–6 to add it · Space to serve · T to trash the plate · R to restart · P to pause</p>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
